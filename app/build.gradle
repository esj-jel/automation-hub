plugins {
    id 'com.android.application'
}

android {
    namespace 'com.esj.automationhub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.esj.automationhub'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
}
